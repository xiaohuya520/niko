name: Update NiKo data

on:
  schedule:
    - cron: "*/30 * * * *"   # 每 30 分钟（GitHub 免费账户可能有几分钟排队延迟，属正常）
  workflow_dispatch:         # 允许在 Actions 页面手动点 "Run workflow" 立即测试
  push:                      # 代码/配置一改就重抓一次
    branches: [main]         # Actions 自己提交 data.json 不会触发新的运行，因此不会死循环
    paths-ignore:
      - "data.json"
      - "*.md"

permissions:
  contents: write
  issues: write

concurrency:
  group: niko-data
  cancel-in-progress: false   # 上一次没跑完就排队，避免并发写冲突

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Scrapling 自适应指纹库（约 4KB）：跨运行保留，页面改版时能靠历史指纹
      # 重新定位元素。已在 .gitignore 中，不会被提交进仓库。
      - name: 恢复 Scrapling 指纹缓存
        uses: actions/cache@v4
        with:
          path: _cache/scrapling
          key: scrapling-fp-${{ github.run_id }}
          restore-keys: |
            scrapling-fp-

      # 可选增强：装不上就自动降级为纯正则解析（`|| true` 保证不阻塞主流程）
      - name: 安装可选依赖
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 第一次运行时把 niko-upload 子目录里的文件搬到仓库根目录，之后自动跳过
      - name: 整理文件到根目录
        run: |
          if [ -d niko-upload ]; then
            cp -r niko-upload/. .
            rm -rf niko-upload
          fi

      - name: Run pipeline
        # 退出码含义: 0=正常 | 2=Liquipedia 改版导致解析器失效（event.json 已保留
        # 旧版数据并打上 parse_warning 标记）。continue-on-error 让后面仍能提交带
        # 告警标记的 event.json（线上赛事中心会显示降级横幅）；失败时由下一步自动开 Issue。
        continue-on-error: true
        run: python run.py

      - name: Commit & push
        run: |
          rm -rf __pycache__
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config core.quotepath false
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "auto: update NiKo data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: 自动开/更新降级告警 Issue
        # 取代原先的「每日轮询巡检」：run.py 失败时由 Actions 即时开/更新一个固定
        # Issue，实时可追溯，不依赖 WorkBuddy 常驻。带告警标记的 event.json 已随上一步部署。
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create auto-alert --description "Liquipedia 改版致解析器失效自动告警" --color b3261e || true
          TITLE="⚠ 赛事解析器疑似被 Liquipedia 改版打挂（需修 parse_event.py）"
          EXIST=$(gh issue list --state open --label auto-alert --json number --jq '.[0].number' || true)
          if [ -n "$EXIST" ]; then
            gh issue comment "$EXIST" --body "仍为降级状态，本次触发于 $(date -u +%Y-%m-%dT%H:%M:%SZ)。event.json 已保留旧版数据，线上赛事中心显示降级横幅。"
          else
            gh issue create --title "$TITLE" --label auto-alert --body "自动检测：run.py 退出码为 2，说明 Liquipedia 页面改版导致解析器失效。**Scrapling 自愈层已先行尝试补位但未成功**（页面空白处才补，补不回来就是内层结构也变了）。

event.json 已保留旧版数据并打上 parse_warning 标记（线上赛事中心会显示降级横幅，站点不会空白）。

请检查：
1. parse_event.py 的分组 / 分支图 / Upcoming Matches 解析逻辑是否需要跟进新模板；
2. parse_event_sl.py 的强判据（upcoming=data-timestamp+双队、brackets=[data-team-shortname]）是否也已失效；
3. Liquipedia 是否已改用新的数据属性，若是请同步更新这两个文件。

本 Issue 由 GitHub Actions 在失败时自动创建 / 更新，取代原先的每日轮询巡检，无需 WorkBuddy 常驻。

最近运行日志：${{ github.server_url }}/${{ github.repository }}/actions"
          fi
