name: update-matches

# 定时抓取 CS2 赛程/实时比分,生成 cs_matches.json 提交到 firmware 分支。
# 注意:GitHub 的 schedule 只认默认分支(main),但本工作流的实际操作全部指向 firmware。
on:
  schedule:
    - cron: "*/10 * * * *"      # 每 10 分钟一次(实际可能有几分钟抖动)
  workflow_dispatch: {}          # 支持手动触发(首次填充数据用)

permissions:
  contents: write

concurrency:
  group: update-matches
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout firmware branch
        uses: actions/checkout@v4
        with:
          ref: firmware
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and build cs_matches.json
        id: build
        run: python tools/update_matches.py cs_matches.json

      - name: Commit if changed
        if: steps.build.outcome == 'success'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet cs_matches.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "数据无变化"
            exit 0
          fi
          git add cs_matches.json
          git commit -m "data: refresh cs_matches.json ($(date -u +'%F %T') UTC)"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase origin firmware && git push origin HEAD:firmware; then
              ok=1; break
            fi
            sleep 10
          done
          if [ "$ok" != "1" ]; then echo "push failed"; exit 1; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # jsDelivr 对分支引用有 ~12h 缓存,提交后主动清掉,设备才能立刻拉到新数据
      - name: Purge jsDelivr cache
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -s "https://purge.jsdelivr.net/gh/xiaohuya520/niko@firmware/cs_matches.json"
          echo "purged"
