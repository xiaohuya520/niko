<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDD9A8">
<meta name="description" content="NiKo 比赛逐图详情">
<title>比赛详情 // NiKo</title>
<link rel="icon" type="image/svg+xml" href="assets/pixel/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/pixel/favicon.png">
<link rel="apple-touch-icon" href="assets/pixel/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
/* ========== Minecraft 像素风 + CS 元素 ========== */
:root{
  --bg:#EDD9A8;            /* 沙色背景 */
  --bg2:#E2CC95;           /* 沙色深 */
  --panel:#F8EFD1;         /* 羊毛色面板 */
  --panel2:#FFE9A8;        /* 高光面板 */
  --panel3:#D8C282;        /* 沙岩深 */
  --line:#2B2B2B;
  --line-soft:#5C5C5C;
  --hi:#FFFFFF;            /* 3D 高光 */
  --shadow-c:#1A1A1A;      /* 3D 阴影 */
  --ink:#262016;           /* 主文字 */
  --ink2:#5C4A2A;          /* 次文字 */
  --dim:#8A7B5C;
  --amber:#D98C2C;         /* 主题金 */
  --amber2:#F4B23A;        /* 浅金 */
  --amber-bg:#FFE3B0;      /* 金背景 */
  --win:#5FBF4A;           /* 绿（MC 草） */
  --win-bg:#C6E8B0;
  --loss:#C0392B;          /* 红 */
  --loss-bg:#F4B8A8;
  --ct:#4C7FD9;            /* CT 蓝 */
  --t:#D9552F;             /* T 橙 */
  --exp:#9C45D9;           /* 附魔紫 */
  --mc-edge:
    inset 0 0 0 2px var(--hi),
    inset 0 0 0 4px var(--line),
    inset 4px 4px 0 6px var(--panel),
    inset -4px -4px 0 6px var(--shadow-c);
  --mc-press:
    inset 0 0 0 2px var(--shadow-c),
    inset 0 0 0 4px var(--line),
    inset 4px 4px 0 6px var(--panel3);
  --mono:"JetBrains Mono","SF Mono",Consolas,"Courier New",monospace;
  --sans:"Bahnschrift","DIN Alternate","Segoe UI","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
img{image-rendering:pixelated;image-rendering:crisp-edges}
body{
  background-color:var(--bg);
  background-image:url("assets/pixel/bg_tile.png");
  background-size:64px 64px;
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.5;
  min-height:100vh;
  text-rendering:optimizeSpeed;
}
a{color:inherit;text-decoration:none}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 80px}

/* === HUD 顶栏（方块感）=== */
.hud{position:sticky;top:0;z-index:50;background:var(--panel);
  border-bottom:4px solid var(--line);
  box-shadow:0 4px 0 rgba(0,0,0,.15)}
.hud-in{max-width:760px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:11px}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-size:19px;letter-spacing:.16em;font-weight:700;color:var(--ink)}
.brand small{font-size:10px;color:var(--ink2);letter-spacing:.2em;font-family:var(--mono);
  background:var(--amber-bg);padding:1px 5px;border:1px solid var(--line);margin-top:2px;
  display:inline-block;width:fit-content}
.hud .ava{width:36px;height:36px;flex:none;background:var(--panel);
  border:2px solid var(--line);
  box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--shadow-c)}
.status{margin-left:auto;display:flex;align-items:center;gap:6px;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  background:var(--panel);color:var(--ink);
  border:2px solid var(--line);
  box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--shadow-c);
  padding:5px 9px}
.dot{width:8px;height:8px;background:var(--amber);border:1px solid var(--line)}
.dot.live{background:var(--loss);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* === 像素准星（CS 元素，亮色）=== */
.crosshair{width:30px;height:30px;flex:none;position:relative}
.crosshair::before,.crosshair::after{content:"";position:absolute;background:var(--amber);
  box-shadow:0 0 0 2px var(--line)}
.crosshair::before{left:50%;top:3px;width:4px;height:24px;transform:translateX(-50%)}
.crosshair::after{top:50%;left:3px;height:4px;width:24px;transform:translateY(-50%)}
.crosshair span{position:absolute;left:50%;top:50%;width:6px;height:6px;background:var(--loss);
  transform:translate(-50%,-50%);border:2px solid var(--line)}

/* === 头像（方块风）=== */
.av{background:var(--panel2);border:2px solid var(--line);object-fit:cover;flex:none;display:block;
  box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--shadow-c)}
.av-xl{width:78px;height:78px}
.av-lg{width:62px;height:62px}
.av-ph{display:grid;place-items:center;font-family:var(--mono);color:var(--ink2);
  background:var(--panel2);border:2px solid var(--line);flex:none;
  box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--shadow-c)}
.av-ph-xl{width:78px;height:78px;font-size:22px}
.av-ph-lg{width:62px;height:62px;font-size:19px}

.prof{display:flex;align-items:center;gap:14px;background:var(--panel);
  border:2px solid var(--line);padding:14px 16px;margin-top:16px;
  box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--shadow-c)}
.prof .nick{font-size:22px;font-weight:700;letter-spacing:.04em;color:var(--ink)}
.prof .full{font-family:var(--mono);font-size:12px;color:var(--ink2);margin-top:2px}
.prof .meta{font-family:var(--mono);font-size:11px;color:var(--amber);margin-top:5px;letter-spacing:.06em;
  background:var(--ink);padding:2px 7px;display:inline-block;border:1px solid var(--line)}
.prof-link{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink2);
  background:var(--panel2);padding:4px 8px;border:2px solid var(--line);
  box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--shadow-c);letter-spacing:.1em}

/* === 横向滚动：队友 === */
.scroller{display:flex;gap:10px;overflow-x:auto;padding:4px 0 10px;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.pc{flex:0 0 132px;scroll-snap-align:start;background:var(--panel);
  border:2px solid var(--line);padding:12px 10px;text-align:center;
  box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--shadow-c)}
.pc:active{box-shadow:inset 2px 2px 0 var(--shadow-c),inset -2px -2px 0 var(--hi)}
.pc .ph{width:62px;height:62px;margin:0 auto 9px}
.pc .pid{font-size:15px;font-weight:700;letter-spacing:.04em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.pc .prole{font-family:var(--mono);font-size:10px;color:var(--amber);background:var(--ink);
  padding:2px 6px;display:inline-block;margin-top:3px;letter-spacing:.08em;border:1px solid var(--line)}
.pc .pnat{font-family:var(--mono);font-size:10px;color:var(--ink2);margin-top:2px}
.hint{font-family:var(--mono);font-size:10px;color:var(--ink2);letter-spacing:.1em;margin-bottom:8px}

/* === 章节 === */
.sec{margin-top:30px;position:relative}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec-h b{font-size:13px;letter-spacing:.2em;color:var(--ink);font-family:var(--mono);font-weight:700;
  background:var(--ink);color:var(--panel);padding:4px 10px;border:2px solid var(--line);
  box-shadow:inset 1px 1px 0 var(--shadow-c)}
.sec-h i{flex:1;height:4px;background:var(--panel);
  border-top:2px solid var(--line);border-bottom:2px solid var(--line)}
.sec-h em{font-family:var(--mono);font-size:11px;color:var(--ink2);font-style:normal;letter-spacing:.1em}
.sec-h a em{color:var(--amber)}

/* === 下一场比赛 hero === */
.hero{margin-top:16px;background:var(--panel);border:3px solid var(--line);position:relative;
  box-shadow:inset 3px 3px 0 var(--hi),inset -3px -3px 0 var(--shadow-c),6px 6px 0 rgba(0,0,0,.15);
  overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;bottom:-20px;width:240px;height:180px;
  background:url("assets/pixel/ak47.png") no-repeat right bottom / contain;
  opacity:.10;pointer-events:none;image-rendering:pixelated}
.hero-top{display:flex;align-items:center;gap:8px;padding:9px 16px;border-bottom:3px solid var(--line);
  background:var(--amber-bg)}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--amber);
  background:var(--ink);padding:3px 8px;font-weight:700}
.hero-body{padding:20px 16px 18px;text-align:center;position:relative;z-index:1}
.vs{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 4px;flex-wrap:wrap}
.team{font-size:26px;font-weight:700;letter-spacing:.04em;color:var(--ink)}
.team.tbd{color:var(--dim)}
.vs-mid{font-family:var(--mono);font-size:13px;color:var(--amber);background:var(--ink);
  padding:3px 9px;letter-spacing:.1em;font-weight:700;border:2px solid var(--line)}
.hero-sub{font-family:var(--mono);font-size:12px;color:var(--ink2);letter-spacing:.06em}
.hero-note{font-family:var(--mono);font-size:11px;color:var(--amber);letter-spacing:.05em;margin-top:10px;
  background:var(--ink);padding:3px 9px;display:inline-block}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 4px}
.cd div{background:var(--panel2);border:2px solid var(--line);padding:10px 4px;
  box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--shadow-c)}
.cd b{display:block;font-family:var(--mono);font-size:24px;font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums;line-height:1;text-shadow:2px 2px 0 var(--shadow-c)}
.cd span{font-size:10px;color:var(--ink2);letter-spacing:.16em;font-family:var(--mono);margin-top:3px;display:block}

/* === 未来赛程卡 === */
.up{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.up-c{background:var(--panel);border:2px solid var(--line);padding:13px 15px;position:relative;
  box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--shadow-c),4px 4px 0 rgba(0,0,0,.12)}
.up-c .n{font-size:16px;font-weight:700;letter-spacing:.03em;color:var(--ink)}
.up-c .d{font-family:var(--mono);font-size:12px;color:var(--amber);margin-top:3px;font-weight:700}
.up-c .m{font-family:var(--mono);font-size:11px;color:var(--ink2);margin-top:7px;letter-spacing:.05em}
.tier{position:absolute;top:11px;right:12px;font-family:var(--mono);font-size:10px;
  color:var(--amber);background:var(--ink);padding:3px 6px;letter-spacing:.08em;font-weight:700}

/* === 战绩 rows === */
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:11px;background:var(--panel);
  border:2px solid var(--line);border-left:6px solid var(--line);padding:10px 13px;
  box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--shadow-c),3px 3px 0 rgba(0,0,0,.1)}
.row:active{box-shadow:inset 2px 2px 0 var(--shadow-c),inset -2px -2px 0 var(--hi)}
.row.W{border-left-color:var(--win)}
.row.L{border-left-color:var(--loss)}
.res{width:28px;height:28px;flex:none;display:grid;place-items:center;font-family:var(--mono);
  font-size:14px;font-weight:700;color:#fff;border:2px solid var(--line)}
.res.W{background:var(--win)} .res.L{background:var(--loss)}
.sc{font-family:var(--mono);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;flex:none;width:58px;color:var(--ink)}
.info{flex:1;min-width:0}
.info .o{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.info .e{font-family:var(--mono);font-size:11px;color:var(--ink2);margin-top:2px;letter-spacing:.03em}
.rt{flex:none;text-align:right;font-family:var(--mono)}
.rt b{font-size:14px;color:var(--ink);font-weight:700}
.rt small{display:block;font-size:10px;color:var(--ink2);letter-spacing:.06em}
.bar{width:56px;height:8px;background:var(--panel2);margin-top:5px;margin-left:auto;
  border:2px solid var(--line);box-shadow:inset 1px 1px 0 var(--shadow-c)}
.bar i{display:block;height:100%;background:var(--win)}
.chev{flex:none;color:var(--ink2);font-size:18px}
.more{display:block;width:100%;margin-top:9px;background:var(--panel);
  border:2px solid var(--line);color:var(--ink);font-family:var(--mono);font-size:12px;letter-spacing:.12em;
  padding:10px;cursor:pointer;font-weight:700;
  box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--shadow-c)}
.more:active{box-shadow:inset 2px 2px 0 var(--shadow-c),inset -2px -2px 0 var(--hi)}

/* === 数据统计格子 === */
.grid{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(112px,1fr))}
.st{background:var(--panel);border:2px solid var(--line);padding:12px 13px;
  box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--shadow-c)}
.st span{display:block;font-family:var(--mono);font-size:10px;color:var(--ink2);letter-spacing:.12em}
.st b{display:block;font-family:var(--mono);font-size:22px;font-weight:700;margin-top:5px;
  color:var(--ink);font-variant-numeric:tabular-nums}
.st.hl b{color:var(--win)}
.st-sub{font-family:var(--mono);font-size:11px;color:var(--ink2);margin-top:3px}

/* === 资料表 === */
.kv{background:var(--panel);border:2px solid var(--line);
  box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--shadow-c)}
.kv-row{display:flex;gap:12px;padding:9px 14px;border-bottom:2px dashed var(--line-soft);font-size:14px}
.kv-row:last-child{border-bottom:none}
.kv-row span{flex:none;width:96px;font-family:var(--mono);font-size:11px;color:var(--ink2);
  letter-spacing:.08em;padding-top:3px;font-weight:700}
.kv-row b{font-weight:500;color:var(--ink)}

/* === 比赛地图 === */
.map{background:var(--panel);border:2px solid var(--line);border-left:6px solid var(--line);
  padding:12px 14px;margin-bottom:9px;
  box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--shadow-c)}
.map.W{border-left-color:var(--win)} .map.L{border-left-color:var(--loss)}
.map.veto{border-left-color:var(--line-soft);opacity:.55}
.map-h{display:flex;align-items:baseline;gap:9px;margin-bottom:8px;flex-wrap:wrap}
.map-h b{font-size:16px;letter-spacing:.04em;color:var(--ink)}
.map-h em{font-family:var(--mono);font-size:10px;font-style:normal;color:var(--ink2);letter-spacing:.1em;
  background:var(--bg2);padding:2px 6px;border:1px solid var(--line)}
.map-en{font-family:var(--mono);font-size:10px;color:var(--ink2);margin-left:7px;letter-spacing:.06em}
.map-res{margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.08em;font-weight:700;
  padding:2px 7px;border:2px solid var(--line)}
.map-res.W{color:#fff;background:var(--win)} .map-res.L{color:#fff;background:var(--loss)}
.mline{display:flex;align-items:center;gap:9px;margin-top:5px}
.mline .who{font-family:var(--mono);font-size:11px;color:var(--ink2);flex:none;width:60px;letter-spacing:.05em;font-weight:700}
.mline .rounds{font-family:var(--mono);font-size:18px;font-weight:700;flex:none;width:40px;
  text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.mline .halves{font-family:var(--mono);font-size:10px;color:var(--ink2);flex:none;width:74px}
.mline .tbar{flex:1;height:8px;background:var(--panel2);border:2px solid var(--line);
  box-shadow:inset 1px 1px 0 var(--shadow-c)}
.mline .tbar i{display:block;height:100%;background:var(--win)}
.mline.L .tbar i{background:var(--loss)}

/* === 链接按钮 === */
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.lk{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink);
  background:var(--panel2);border:2px solid var(--line);padding:7px 11px;font-weight:700;
  box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--shadow-c)}
.lk:active{box-shadow:inset 1px 1px 0 var(--shadow-c),inset -1px -1px 0 var(--hi)}

/* === 队伍格 === */
.team-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tc{background:var(--panel);border:2px solid var(--line);padding:14px;text-align:center;
  box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--shadow-c),3px 3px 0 rgba(0,0,0,.12)}
.tc .ph{width:76px;height:76px;margin:0 auto 10px}
.tc .pid{font-size:17px;font-weight:700;letter-spacing:.04em;color:var(--ink)}
.tc .pfull{font-family:var(--mono);font-size:10px;color:var(--ink2);margin-top:2px}
.tc .prole{font-family:var(--mono);font-size:11px;color:var(--amber);background:var(--ink);
  padding:3px 8px;display:inline-block;margin-top:6px;letter-spacing:.08em;font-weight:700}
.tc .pdesc{font-size:11px;color:var(--ink2);margin-top:5px;line-height:1.35}

/* === 准星练习 === */
.xh{display:grid;place-items:center;background:var(--panel);border:2px solid var(--line);
  height:130px;margin-top:10px;position:relative;overflow:hidden;
  box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--shadow-c)}
.xh i{position:absolute;background:var(--amber)}

/* === 武器装饰条 === */
.guns-strip{height:120px;margin-top:20px;background:url("assets/pixel/guns_strip.png") repeat-x center/auto 100px;
  border-top:3px dashed var(--line);border-bottom:3px dashed var(--line);position:relative}
.guns-strip::before,.guns-strip::after{content:"";position:absolute;top:0;bottom:0;width:40px;pointer-events:none}
.guns-strip::before{left:0;background:linear-gradient(90deg,var(--bg),transparent)}
.guns-strip::after{right:0;background:linear-gradient(270deg,var(--bg),transparent)}

/* === 页脚 === */
.foot{margin-top:30px;padding-top:16px;border-top:3px solid var(--line);
  font-family:var(--mono);font-size:11px;color:var(--ink2);line-height:1.7}
.foot a{color:var(--amber);font-weight:700}
.syncbar{display:flex;align-items:center;gap:8px;margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--ink2);
  background:var(--panel);padding:6px 10px;border:2px solid var(--line);
  box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--shadow-c)}
.empty{padding:26px 14px;text-align:center;color:var(--ink2);font-family:var(--mono);font-size:12px;
  background:var(--panel);border:2px dashed var(--line-soft);margin-top:8px}
.back{margin-top:16px}

/* 移动端微调 */
@media(max-width:380px){
  .hud-in{padding:8px 10px;gap:8px}
  .brand b{font-size:17px}
  .prof .nick{font-size:19px}
  .team{font-size:22px}
  .cd b{font-size:20px}
  .row{padding:9px 11px;gap:9px}
  .res{width:24px;height:24px;font-size:12px}
  .sc{width:50px;font-size:15px}
}
</style>
</head>
<body data-page="match">
<div class="hud"><div class="hud-in">
  <div class="crosshair"><span></span></div>
  <div class="brand"><b>NIKO</b><small>赛事跟踪</small></div>
  <div class="status"><i class="dot" id="dot"></i><span id="statusTxt">待战</span></div>

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const params = new URLSearchParams(location.search);

function bj(iso){
  if(!iso) return '';
  const d = new Date(iso), p = n => String(n).padStart(2,'0');
  const wk = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${wk} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function boText(bo){ return {Bo1:'单图决胜',Bo3:'三局两胜',Bo5:'五局三胜'}[bo] || bo || ''; }
/* 地图名中文化（保留英文原名，CS 玩家两种叫法都在用） */
const MAP_ZH = {'Dust II':'炙热沙城 II','Mirage':'荒漠迷城','Inferno':'炼狱小镇',
  'Nuke':'核子危机','Ancient':'远古遗迹','Anubis':'阿努比斯神庙',
  'Train':'列车停放站','Overpass':'死亡游乐园','Vertigo':'殒命大厦'};
function mapName(m){
  const zh = MAP_ZH[m];
  return zh ? `${esc(zh)}<span class="map-en">${esc(m)}</span>` : esc(m);
}
function tierText(t){ return String(t||'').replace('S-Tier','S 级').replace('A-Tier','A 级'); }
function ini(id){ return esc(String(id||'?').slice(0,2).toUpperCase()); }

/* 头像：有图用图，无图或加载失败用首两位字母兜底 */
function avatar(src, name, cls){
  const ph = `<div class="av-ph av-ph-${cls}">${ini(name)}</div>`;
  if(!src) return ph;
  // onerror 里的 HTML 必须把双引号转成实体，否则会提前闭合属性
  const fb = ph.replace(/"/g, '&quot;').replace(/\n/g, '');
  return `<img class="av av-${cls}" src="${esc(src)}" alt="${esc(name)}"
    onerror="this.outerHTML='${fb}'">`;
}
function dataOf(){ return FRESH || D; }

async function pullNewest(){
  const urls = [];
  if(REPO && REPO !== 'xiaohuya520/niko'){
    urls.push(['https://cdn.jsdelivr.net/gh/' + REPO + '@main/data.json', 'jsDelivr']);
    urls.push(['https://raw.githubusercontent.com/' + REPO + '/main/data.json', 'GitHub 直连']);
  }
  urls.push(['./data.json', '同源']);
  for(const [u, tag] of urls){
    try{
      const r = await fetch(u + '?t=' + Date.now(), {cache:'no-store'});
      if(!r.ok) continue;
      const d = await r.json();
      if(d && d.recent_matches){ FRESH = d; return tag; }
    }catch(e){}
  }
  return null;
}
async function sync(labelEl){
  const tag = await pullNewest();
  if(labelEl) labelEl.textContent = tag
    ? `● 已同步最新数据（${tag}）`
    : '○ 离线缓存（未能联网）';
  if(tag) { const cur = location.hash; }
  return tag;
}
function startCountdown(target, onChange){
  const el = {
    d: document.getElementById('cdD'), h: document.getElementById('cdH'),
    m: document.getElementById('cdM'), s: document.getElementById('cdS')
  };
  if(!el.d) return;
  const tick = () => {
    let diff = target ? (new Date(target) - Date.now()) / 1000 : 0;
    if(diff < 0) diff = 0;
    const dd = Math.floor(diff / 86400), hh = Math.floor(diff % 86400 / 3600),
          mm = Math.floor(diff % 3600 / 60), ss = Math.floor(diff % 60);
    el.d.textContent = dd; el.h.textContent = String(hh).padStart(2,'0');
    el.m.textContent = String(mm).padStart(2,'0'); el.s.textContent = String(ss).padStart(2,'0');
    const st = document.getElementById('statusTxt'), dot = document.getElementById('dot');
    if(st && diff <= 0){ st.textContent = '进行中'; dot.classList.add('live'); }
    else if(st){ st.textContent = '待战'; }
  };
  tick(); setInterval(tick, 1000);
}
function drawCrosshair(x, boxId){
  const box = document.getElementById(boxId || 'xhBox');
  if(!box || !x || !x.style) return;
  const len = 6 + Number(x.size || 1) * 2;
  const th = Number(x.thickness || 1);
  const gap = Math.abs(Number(x.gap || 0));
  const c = document.createElement('div');
  c.style.cssText = 'position:relative;width:0;height:0';
  const mk = () => { const i = document.createElement('i'); return i; };
  // 用四个小方块模拟 CS style 4 准星
  [[0,-gap-len],[0,gap],[-gap-len,0],[gap,0]].forEach(([lx,ly]) => {
    const i = mk();
    i.style.width = (lx === 0 ? th : len) + 'px';
    i.style.height = (lx === 0 ? len : th) + 'px';
    i.style.left = lx + 'px';
    i.style.top = ly + 'px';
    c.appendChild(i);
  });
  box.innerHTML = ''; box.appendChild(c);
}

function render(){
  const d = dataOf(), id = params.get('id');
  const m = d.recent_matches.find(x => x.id === id);
  const app = document.getElementById('app');
  if(!m){
    app.innerHTML = `<div class="back"><a class="lk" href="index.html">‹ 返回</a></div>
      <div class="empty" style="margin-top:30px">找不到这场比赛<br><br>
      <a class="lk" href="index.html">返回首页</a></div>`;
    return;
  }
  const played = (m.maps||[]).filter(p => !p.vetoed);
  const vetoed = (m.maps||[]).filter(p => p.vetoed);
  const rs = (m.niko && m.niko.ratings) || [];
  const avg = rs.length ? rs.reduce((a,b)=>a+b,0)/rs.length : null;

  const maxRound = Math.max(...played.map(p =>
    Math.max(Number(p.falcons.rounds)||0, Number(p.opponent.rounds)||0)), 13);

  const mapHtml = played.map((p, i) => {
    const fw = p.falcons_win;
    const fr = Number(p.falcons.rounds)||0, orr = Number(p.opponent.rounds)||0;
    return `<div class="map ${fw ? 'W' : 'L'}">
      <div class="map-h">
        <b>第 ${i+1} 图 · ${mapName(p.map)}</b>
        <em>${fr + orr > 24 ? '加时 · ' : ''}共 ${fr + orr} 回合</em>
        <div class="map-res ${fw?'W':'L'}">${fw ? '胜' : '负'} ${fr}-${orr}</div>
      </div>
      <div class="mline ${fw?'':'L'}">
        <div class="who">${esc(d.player.nick)}</div>
        <div class="rounds">${fr}</div>
        <div class="tbar"><i style="width:${Math.min(100, fr/maxRound*100)}%"></i></div>
        <div class="halves">进攻 ${esc(p.falcons.t)||'—'} / 防守 ${esc(p.falcons.ct)||'—'}</div>
      </div>
      <div class="mline ${fw?'L':''}">
        <div class="who">${esc(m.opponent)}</div>
        <div class="rounds">${orr}</div>
        <div class="tbar"><i style="width:${Math.min(100, orr/maxRound*100)}%"></i></div>
        <div class="halves">进攻 ${esc(p.opponent.t)||'—'} / 防守 ${esc(p.opponent.ct)||'—'}</div>
      </div>
    </div>`;
  }).join('') || '<div class="empty">暂无逐图数据</div>';

  const vetoHtml = vetoed.length ? `
    <div class="sec">
      <div class="sec-h"><b>未选用地图</b><i></i><em>双方已禁用</em></div>
      <div class="rows">${vetoed.map(p => `
        <div class="map veto" style="margin-bottom:0">
          <div class="map-h"><b>${mapName(p.map)}</b><em>Bo${(m.maps||[]).length>3?3:1} 未启用</em></div>
        </div>`).join('')}</div>
    </div>` : '';

  const links = [];
  if(m.links && m.links.hltv_match) links.push([m.links.hltv_match, 'HLTV 全场统计']);
  (m.links && m.links.hltv_maps || []).forEach(g =>
    links.push([g.url, `第 ${g.game} 图 HLTV 数据`]));
  (m.links && m.links.vods || []).forEach(v =>
    links.push([v.url, `第 ${v.game} 图录像`]));
  const linkHtml = links.length
    ? `<div class="links">${links.map(([u,t]) =>
        `<a class="lk" href="${esc(u)}" target="_blank" rel="noopener">${esc(t)} ↗</a>`).join('')}</div>`
    : '';

  app.innerHTML = `
  <div class="back"><a class="lk" href="index.html">‹ 返回首页</a></div>
  <div class="hero">
    <div class="hero-top"><span class="tag">比赛详情</span></div>
    <div class="hero-body">
      <div class="vs">
        <div class="team">FALCONS</div>
        <div class="vs-mid">${esc(m.score)}</div>
        <div class="team">${esc(m.opponent)}</div>
      </div>
      <div class="hero-sub">${esc(bj(m.date))}</div>
      <div class="hero-note">${m.result === 'W' ? '取胜' : '落败'} · ${boText(m.bo)} · ${esc(m.event)}</div>
    </div>
  </div>

  <div class="sec">
    <div class="sec-h"><b>逐图详情</b><i></i><em>${played.length} 张地图</em></div>
    ${mapHtml}
  </div>

  ${vetoHtml}

  <div class="sec">
    <div class="sec-h"><b>${esc(d.player.nick)} 本场数据</b><i></i><em>HLTV</em></div>
    <div class="grid">
      <div class="st"><span>系列赛评分</span><b>${avg !== null ? avg.toFixed(2) : '—'}</b></div>
      ${(m.niko||{}).kd ? `<div class="st"><span>击杀 / 死亡</span><b>${esc(m.niko.kd)}</b></div>` : ''}
      ${(m.niko||{}).adr ? `<div class="st"><span>场均伤害 ADR</span><b>${esc(m.niko.adr)}</b></div>` : ''}
    </div>
    ${(m.niko||{}).note ? `<div class="kv" style="margin-top:10px">
      <div class="kv-row"><span>备注</span><b>${esc(m.niko.note)}</b></div></div>` : ''}
    ${!avg && !(m.niko||{}).kd ? '<div class="empty">本场尚未核对个人数据</div>' : ''}
  </div>

  ${linkHtml ? `<div class="sec"><div class="sec-h"><b>相关链接</b><i></i><em>跳转外部站点</em></div>${linkHtml}</div>` : ''}

  <div class="syncbar"><span id="liveStatus">○ 正在获取最新数据…</span></div>
  <div class="foot">
    地图回合按「进攻方 / 防守方」拆分；加时回合不计入该项统计。<br>
    数据来源：Liquipedia（CC BY-SA 3.0）。最近更新：2026-09-10T04:25:27+00:00
  </div>`;
}

async function boot(){ await pullNewest(); render(); sync(document.getElementById('liveStatus')); }

render();
boot();
</script>
</body>
