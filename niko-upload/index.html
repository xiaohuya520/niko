<style>
:root{
  --bg:#08090b; --panel:#101215; --panel2:#161a1e; --line:#242a30;
  --amber:#f0a742; --amber2:#ffc76b; --amber-dim:#6d5322;
  --txt:#e9e7e4; --dim:#7d8288; --win:#3fb950; --loss:#f0554f;
  --mono:Consolas,"SF Mono","Roboto Mono","Courier New",monospace;
  --sans:"Bahnschrift","DIN Alternate",Rajdhani,"Segoe UI","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt); font-family:var(--sans);
  font-size:15px; line-height:1.5; min-height:100vh;
  -webkit-font-smoothing:antialiased;
  background-image:
    linear-gradient(rgba(240,167,66,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(240,167,66,.035) 1px,transparent 1px);
  background-size:44px 44px;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:999;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);
  opacity:.5;
}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 56px}

/* ---------- HUD header ---------- */
.hud{
  position:sticky;top:0;z-index:50;background:rgba(8,9,11,.94);
  border-bottom:1px solid var(--line);backdrop-filter:blur(8px);
}
.hud-in{max-width:760px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:12px}
.crosshair{width:26px;height:26px;flex:none;position:relative}
.crosshair::before,.crosshair::after{
  content:"";position:absolute;background:var(--amber);
}
.crosshair::before{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%)}
.crosshair::after{top:50%;left:0;height:2px;width:100%;transform:translateY(-50%)}
.crosshair span{position:absolute;inset:8px;border:2px solid var(--amber);border-radius:50%}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-size:19px;letter-spacing:.14em;font-weight:600}
.brand small{font-size:11px;color:var(--dim);letter-spacing:.18em;font-family:var(--mono)}
.status{
  margin-left:auto;display:flex;align-items:center;gap:6px;
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  border:1px solid var(--line);padding:5px 9px;
  clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,7px 100%,0 calc(100% - 7px));
}
.dot{width:7px;height:7px;background:var(--amber);border-radius:50%}
.dot.live{background:var(--loss);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- hero ---------- */
.hero{margin-top:16px;position:relative;border:1px solid var(--amber-dim);background:var(--panel);
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));}
.hero-top{display:flex;align-items:center;gap:8px;padding:9px 16px;border-bottom:1px solid var(--line);
  background:linear-gradient(90deg,rgba(240,167,66,.14),transparent)}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--amber)}
.hero-body{padding:20px 16px 18px;text-align:center}
.vs{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 4px}
.team{font-size:26px;font-weight:600;letter-spacing:.06em}
.team.tbd{color:var(--dim)}
.vs-mid{font-family:var(--mono);font-size:13px;color:var(--amber);letter-spacing:.1em}
.hero-sub{font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.06em}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 4px}
.cd div{background:var(--panel2);border:1px solid var(--line);padding:10px 4px;
  clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));}
.cd b{display:block;font-family:var(--mono);font-size:26px;font-weight:600;color:var(--amber2);
  font-variant-numeric:tabular-nums;line-height:1}
.cd span{font-size:10px;color:var(--dim);letter-spacing:.16em;font-family:var(--mono)}
.hero-note{font-family:var(--mono);font-size:11px;color:var(--amber);letter-spacing:.05em;margin-top:10px}

/* ---------- sections ---------- */
.sec{margin-top:30px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec-h b{font-size:13px;letter-spacing:.2em;color:var(--txt);font-family:var(--mono);font-weight:600}
.sec-h i{flex:1;height:1px;background:var(--line)}
.sec-h em{font-family:var(--mono);font-size:11px;color:var(--dim);font-style:normal;letter-spacing:.1em}

/* upcoming cards */
.up{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.up-c{background:var(--panel);border:1px solid var(--line);padding:13px 15px;position:relative;
  clip-path:polygon(0 0,calc(100% - 11px) 0,100% 11px,100% 100%,11px 100%,0 calc(100% - 11px));}
.up-c .n{font-size:16px;font-weight:600;letter-spacing:.03em}
.up-c .d{font-family:var(--mono);font-size:12px;color:var(--amber);margin-top:3px}
.up-c .m{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:7px;letter-spacing:.05em}
.tier{position:absolute;top:11px;right:12px;font-family:var(--mono);font-size:10px;
  color:var(--amber);border:1px solid var(--amber-dim);padding:2px 6px;letter-spacing:.08em}

/* match rows */
.rows{display:flex;flex-direction:column;gap:7px}
.row{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);
  border-left:3px solid var(--line);padding:10px 13px}
.row.W{border-left-color:var(--win)}
.row.L{border-left-color:var(--loss)}
.res{width:26px;height:26px;flex:none;display:grid;place-items:center;font-family:var(--mono);
  font-size:13px;font-weight:600;color:#08090b}
.res.W{background:var(--win)} .res.L{background:var(--loss)}
.sc{font-family:var(--mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;flex:none;width:56px}
.info{flex:1;min-width:0}
.info .o{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .e{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:2px;letter-spacing:.03em}
.rt{flex:none;text-align:right;font-family:var(--mono)}
.rt b{font-size:14px;color:var(--amber2);font-weight:600}
.rt small{display:block;font-size:10px;color:var(--dim);letter-spacing:.06em}
.bar{width:52px;height:3px;background:#242a30;margin-top:4px;margin-left:auto}
.bar i{display:block;height:100%;background:var(--amber)}

/* stats grid */
.grid{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(112px,1fr))}
.st{background:var(--panel);border:1px solid var(--line);padding:12px 13px;
  clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px));}
.st span{display:block;font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.12em}
.st b{display:block;font-family:var(--mono);font-size:23px;font-weight:600;margin-top:5px;
  color:var(--amber2);font-variant-numeric:tabular-nums}
.st.hl b{color:var(--win)}

.major{background:var(--panel);border:1px solid var(--amber-dim);padding:13px 15px;margin-top:10px;
  display:flex;align-items:center;gap:12px}
.major .t{font-family:var(--mono);font-size:11px;color:var(--amber);letter-spacing:.14em}
.major .v{font-size:15px;font-weight:600;margin-top:2px}
.major .s{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:2px}

.more{display:block;width:100%;margin-top:9px;background:var(--panel);border:1px solid var(--line);
  color:var(--amber);font-family:var(--mono);font-size:12px;letter-spacing:.1em;padding:10px;
  cursor:pointer;clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px))}
.more:hover{border-color:var(--amber-dim);background:var(--panel2)}
.gear{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(148px,1fr))}
.gear-i{background:var(--panel);border:1px solid var(--line);padding:10px 12px;

.gear-i span{display:block;font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.12em}
.gear-i b{display:block;font-size:13px;font-weight:600;margin-top:4px;line-height:1.35}
.xhair{margin-top:9px;background:var(--panel);border:1px solid var(--line);padding:13px 15px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.xhair .cv{width:74px;height:74px;flex:none;background:#111318;border:1px solid var(--line);

.xhair .kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 14px;flex:1;min-width:180px}
.xhair .kv div{font-family:var(--mono);font-size:11px;color:var(--dim)}
.xhair .kv div em{font-style:normal;color:var(--txt);float:right}
.xhair .code{width:100%;font-family:var(--mono);font-size:11px;color:var(--amber);
  word-break:break-all;letter-spacing:.04em}

footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:11px;color:var(--dim);line-height:1.9}
footer a{color:var(--dim)}
.livebar{display:flex;align-items:center;gap:10px;margin-top:14px;
  font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.08em}
.livebar button{background:var(--panel);border:1px solid var(--line);color:var(--amber);
  font-family:var(--mono);font-size:11px;padding:6px 12px;cursor:pointer;letter-spacing:.1em;

.livebar button:hover{border-color:var(--amber-dim);background:var(--panel2)}
.livebar b{color:var(--win);font-weight:600}
@media(max-width:400px){
  .team{font-size:21px}.cd b{font-size:21px}.sc{width:48px;font-size:15px}
}
</style>
</head>

<script>
const inlineData = JSON.parse(document.getElementById('niko-data').textContent);

function render(D){
  const P = D.player;
  const bj = s => new Date(s).toLocaleString('zh-CN',
    {timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
  const pad = n => String(n).padStart(2,'0');

  /* hero */
  const target = D.next_match ? D.next_match.date
               : (D.upcoming_tournaments[0] ? D.upcoming_tournaments[0].start : null);
  if (D.next_match){
    document.getElementById('heroOpp').textContent = D.next_match.opponent;
    document.getElementById('heroOpp').classList.remove('tbd');
    document.getElementById('heroSub').textContent = D.next_match.event + ' · ' + D.next_match.stage;
    document.getElementById('heroNote').textContent = '开赛 ' + bj(D.next_match.date) + ' (北京时间)';
  } else if (D.upcoming_tournaments.length){
    const t = D.upcoming_tournaments[0];
    document.getElementById('heroTAG').textContent = '下一站赛事';
    document.getElementById('heroSub').textContent = t.name + ' · ' + t.date_text;
    document.getElementById('heroNote').textContent = '对阵尚未公布 · 已确认参赛';
  }

  function tick(){
    if(!target) return;
    let d = new Date(target) - Date.now();
    if(d < 0) d = 0;
    const s = Math.floor(d/1000);
    document.getElementById('cdD').textContent = Math.floor(s/86400);
    document.getElementById('cdH').textContent = pad(Math.floor(s%86400/3600));
    document.getElementById('cdM').textContent = pad(Math.floor(s%3600/60));
    document.getElementById('cdS').textContent = pad(s%60);
  }
  clearInterval(window.__nikoTick); window.__nikoTick = setInterval(tick,1000); tick();

  /* upcoming */
  document.getElementById('upList').innerHTML = D.upcoming_tournaments.map(t=>`
    <div class="up-c">
      <div class="tier">${t.tier}</div>
      <div class="n">${t.short}</div>
      <div class="d">${t.date_text}</div>
      <div class="m">${t.name}</div>
    </div>`).join('');
  document.getElementById('upCount').textContent = D.upcoming_tournaments.length + ' 项赛事';

  /* recent */
  const maxR = Math.max(...D.recent_matches.flatMap(m=>(m.niko&&m.niko.ratings)||[0]));
  const PREV = 12;
  let showAll = false;
  function renderRec(){
    const list = showAll ? D.recent_matches : D.recent_matches.slice(0,PREV);
    document.getElementById('recList').innerHTML = list.map(m=>{
      const rs = (m.niko && m.niko.ratings) || [];
      const avg = rs.length ? (rs.reduce((a,b)=>a+b,0)/rs.length) : null;
      const meta = [m.event, m.stage, m.bo].filter(Boolean).join(' · ');
      return `<div class="row ${m.result}">
      <div class="res ${m.result}">${m.result==='W'?'胜':'负'}</div>
      <div class="sc">${m.score}</div>
      <div class="info">
        <div class="o">${m.opponent}</div>
        <div class="e">${meta}</div>
      </div>
      <div class="rt">${avg!==null
        ? `<b>${avg.toFixed(2)}</b><small>评分</small>
           <div class="bar"><i style="width:${Math.min(100,avg/maxR*100)}%"></i></div>`
        : `<small style="padding-top:6px">—</small>`}</div>
    </div>`;
    }).join('');
    const btn = document.getElementById('moreBtn');
    if(D.recent_matches.length > PREV){
      btn.style.display='block';
      btn.textContent = showAll ? '收起' : '展开全部 ' + D.recent_matches.length + ' 场';
      btn.onclick = ()=>{showAll=!showAll; renderRec();};
    } else { btn.style.display='none'; }
  }
  renderRec();
  const w = D.recent_matches.filter(m=>m.result==='W').length;
  document.getElementById('recCount').textContent = `${w} 胜 ${D.recent_matches.length-w} 负`;

  /* year stats */
  if(D.year_stats){
    const y = D.year_stats;
    document.getElementById('yearStat').textContent = y.from + ' 至 ' + y.to;
    document.getElementById('yearGrid').innerHTML = [
      ['总场次', y.matches, false],
      ['胜 / 负', y.wins + ' / ' + y.losses, false],
      ['胜率', y.win_rate + '%', true],
      ['参赛站数', y.events, false]
    ].map(([k,v,hl])=>`<div class="st${hl?' hl':''}"><span>${k}</span><b>${v}</b></div>`).join('');
  }

  /* gear */
  const g = P.gear || {};
  document.getElementById('gearBox').innerHTML = [
    ['鼠标', g.mouse], ['鼠标垫', g.mousepad], ['DPI', g.dpi],
    ['游戏内灵敏度', g.sens], ['eDPI', g.edpi], ['回报率', g.polling],
    ['显示器', g.monitor], ['刷新率', g.refresh], ['分辨率', g.resolution],
    ['键盘', g.keyboard], ['耳机', g.headset], ['开镜灵敏度', g.zoom_sens]
  ].filter(x=>x[1]).map(([k,v])=>
    `<div class="gear-i"><span>${k}</span><b>${v}</b></div>`).join('');

  /* crosshair preview */
  const x = P.crosshair || {};
  if(x.style){
    const c=37, L=3+Number(x.size)*2, gp=Number(x.gap), th=Number(x.thickness)||1;
    const col=x.color==='5'?'#5fd35f':'#f0a742';
    document.getElementById('xhairBox').innerHTML = `
    <div class="cv"><svg width="74" height="74" viewBox="0 0 74 74" role="img"
      aria-label="NiKo 准星预览">
      <g stroke="${col}" stroke-width="${th}" opacity="${(Number(x.alpha)/255).toFixed(2)}">
        <line x1="${c}" y1="${c-gp-L}" x2="${c}" y2="${c-gp}"/>
        <line x1="${c}" y1="${c+gp}" x2="${c}" y2="${c+gp+L}"/>
        <line x1="${c-gp-L}" y1="${c}" x2="${c-gp}" y2="${c}"/>
        <line x1="${c+gp}" y1="${c}" x2="${c+gp+L}" y2="${c}"/>
      </g></svg></div>
    <div class="kv">
      <div>样式<em>${x.style}</em></div><div>大小<em>${x.size}</em></div>
      <div>粗细<em>${x.thickness}</em></div><div>间隙<em>${x.gap}</em></div>
      <div>描边<em>${x.outline}</em></div><div>中心点<em>${x.dot}</em></div>
      <div>颜色<em>${x.color}</em></div><div>透明度<em>${x.alpha}</em></div>
    </div>
    <div class="code">准星分享码 ${P.crosshair_sharecode}</div>`;
  }

  /* stats */
  const c = P.career;
  const winNum = parseInt((P.winnings||'').replace(/[^\d]/g,''),10) || 0;
  const cards = [
    ['近三月评分', P.rating_3m.toFixed(2), false],
    ['世界排名', '#'+P.team_rank, true],
    ['近三月图数', P.maps_3m, false],
    ['生涯 K/D', c.kd.toFixed(2), false],
    ['生涯 ADR', c.adr, false],
    ['生涯 MVP', c.mvp, false],
    ['国籍', P.country, false],
    ['生涯奖金', winNum ? (winNum/10000).toFixed(0)+' 万美元' : '—', false],
    ['职业年限', (P.years_active||'').replace('Present','至今'), false]
  ];
  document.getElementById('statGrid').innerHTML = cards.map(([k,v,hl])=>
    `<div class="st${hl?' hl':''}"><span>${k}</span><b>${v}</b></div>`).join('');
  document.getElementById('majorBox').innerHTML = `
    <div><div class="t">MAJOR 冠军</div>
    <div class="v">${P.major.title}</div>
    <div class="s">${P.major.date} · ${P.major.result} · ${P.major.note}</div></div>`;

  document.getElementById('foot').innerHTML =
    '数据更新 ' + bj(D.meta.updated) +
    ' · 赛程/比分 ' + D.meta.sources.map(s=>
      `<a href="${s.url}" target="_blank" rel="noopener">${s.name}</a>`).join(' + ') +
    '<br>个人 rating 取自 HLTV，赛程与系列赛比分取自 Liquipedia（CC-BY-SA 3.0）。所有时间已换算为北京时间。';
}

/* 先渲染内联数据，保证即使离线也有内容 */
render(inlineData);

/* 实时：按优先级依次尝试各数据源，全部失败则保留内联缓存。
   顺序由构建参数决定：
     workbuddy 发布版 -> jsDelivr 优先（可跨源拿到仓库最新数据）
     GitHub Pages 版  -> 同源优先（本仓库 data.json 即最新）          */
const REPO = 'xiaohuya520/niko';      // 填入 "用户名/仓库名" 后启用 jsDelivr 通道
const PREFER_LOCAL = true;
const liveStatus = document.getElementById('liveStatus');
function endpoints(){
  const t = Date.now();
  const local = ['./data.json?t=' + t, '本地'];
  const jd = (REPO && REPO !== 'xiaohuya520/niko')
    ? ['https://cdn.jsdelivr.net/gh/' + REPO + '@main/data.json?t=' + t, 'jsDelivr'] : null;
  // jsDelivr 对分支有最长 12 小时缓存，raw 几乎实时，作为新鲜度兜底
  const raw = (REPO && REPO !== 'xiaohuya520/niko')
    ? ['https://raw.githubusercontent.com/' + REPO + '/main/data.json?t=' + t, 'GitHub 直连'] : null;
  const arr = PREFER_LOCAL ? [local, raw, jd] : [jd, raw, local];
  return arr.filter(Boolean);
}
async function refresh(){
  if(liveStatus) liveStatus.textContent = '同步中…';
  for(const [url, tag] of endpoints()){
    try{
      const r = await fetch(url, {cache:'no-store'});
      if(!r.ok) continue;
      const D2 = await r.json();
      render(D2);
      if(liveStatus) liveStatus.innerHTML = '<b>● 已同步最新数据（' + tag + '）</b>';
      return true;
    }catch(e){ /* 尝试下一个源 */ }
  }
  if(liveStatus) liveStatus.textContent = '○ 离线缓存（未联网）';
  return false;
}
refresh();
const rb = document.getElementById('refreshBtn');
if(rb) rb.onclick = refresh;

/* PWA 离线缓存：仅在自有域名启用，workbuddy.link 不注册，避免显示旧数据 */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')
    && !location.hostname.includes('workbuddy.link')) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
